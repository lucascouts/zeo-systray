[package]
name = "zeo-systray"
version = "0.2.1"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Desktop tray indicator for Claude Code agent sessions, fed by hooks"
repository = "https://github.com/zeo-workspace/zeo-systray"

[dependencies]
# "blocking" is only the API shape; ksni still needs a reactor underneath.
# async-io (smol) instead of the default tokio: this daemon has two threads
# and no async of its own, so a full work-stealing runtime buys nothing.
ksni = { version = "0.3", default-features = false, features = ["blocking", "async-io"] }
# Desktop notifications are spoken directly over zbus, which ksni already
# brings in: the connection that shows a popup must outlive it, or Plasma
# strips its buttons (see src/actions.rs).
futures-lite = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
zbus = { version = "5", default-features = false, features = ["async-io"] }

[profile.release]
strip = true
